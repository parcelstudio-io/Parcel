# Parcel — the PROTOTYPE profile (card P0-A, 2026-08-22).
#
# THIS FILE IS AN OVERLAY, NOT A CONFIG. It is deep-merged ON TOP OF
# configs/robot.yaml by parcel_robot.config.ConfigStore; every key absent here
# keeps the shipped value, and mappings merge key by key (a list replaces).
#
# Select it with either of:
#
#     scripts/launch_stack.sh --prototype        # exports PARCEL_PROFILE for
#                                                # the panel AND the simulator
#     PARCEL_PROFILE=prototype .parcel/bin/python -m parcel_robot.web_panel ...
#
# WHY A SEPARATE FILE. configs/robot.yaml is SHA-locked by
# evals/companion/embodied_plan_v1/manifest.json (and checked in
# scripts/ci_gate.py), so until this card every prototype relaxation was an
# edit that moved a frozen digest and dragged an eval re-freeze behind it. The
# overlay carries the relaxations without touching that file's bytes.
#
# THE MERGED RESULT IS VALIDATED BY THE SAME LOADERS. Nothing downstream knows
# profiles exist: a typo here fails at startup exactly where a typo in
# configs/robot.yaml would, and with the same message. There is no separate
# schema to keep in step, and no key here that the shipped file does not
# already define somewhere.

# ---------------------------------------------------------------------------
# THE EYE (card P0-A deliverable 3)
#
# `perception.camera_ingress` is THE camera switch, and it is the one this
# profile sets. Setting it starts the C-1 observation stream AND (card P0-A)
# grants pixel grounding, which used to be a second switch that REFUSED this
# one at startup — an operator who wanted both had to answer "which of these is
# authoritative" from a snapshot and then pick one.
#
# SCOPE, stated exactly, because "one flag" overstates it. The collapse joined
# the two GROUNDING spellings (`camera_ingress.enabled` and the
# PARCEL_CAMERA_INGRESS env var now resolve with this key in
# `_camera_ingress_enabled`). It did NOT join the stream:
# `_attach_configured_camera_ingress` reads this config key alone, so
# `PARCEL_CAMERA_INGRESS=1` grounds without starting a stream and
# `PARCEL_CAMERA_INGRESS=0` does not stop one this key started. Finishing that
# means editing the attach site, which is outside card P0-A's region — see
# scrum/20260822/task_1/P0A_STATUS.md "Handoffs". Setting the key HERE, as this
# profile does, moves both consumers, which is why the profile sets the key and
# not the env var.
#
# The stream still needs a producer and an EGL-capable, same-process simulator;
# this key is the runtime's consent, not a guarantee that a camera exists.
# Absent everywhere is still OFF.
perception:
  camera_ingress: true

  # Semantic perception, not the control loop. The validator caps this at
  # 10 Hz; 2 Hz is the C-1 default and what the detector was measured at.
  camera_ingress_rate_hz: 2.0

  # The open-vocabulary query batch. "person" is MANDATORY (the loader refuses
  # a batch without it) because the person-relevant inference lease is taken on
  # the strength of this list — a camera that never asks about people must not
  # claim the person-relevant admission path.
  #
  # The rest is the indoor vocabulary the desk prototype actually lives in;
  # configs/robot.yaml's default batch is [person, lamppost], which is the
  # city-block sim's street furniture. Max 16 phrases.
  camera_ingress_queries:
    - person
    - chair
    - table
    - door
    - couch
    - laptop
    - cup
    - backpack

# ---------------------------------------------------------------------------
# AFFECT (configs/robot.yaml:218-221)
#
# 0.75 -> 0.50. At 0.75 the affect estimator effectively never proposed a
# social action, so the companion read as unresponsive to how the owner sounds.
# This threshold gates a PROPOSAL, not a motion: an accepted proposal still
# goes through the arbiter, the reactive gate and the collision gate like every
# other behavior, and `social_action_cooldown_s` still bounds the rate.
agent:
  affect:
    minimum_confidence: 0.5

# ---------------------------------------------------------------------------
# INDOOR PERSON STANDOFF — DELIVERED BY CARD P1-E (2026-08-22).
#
# HISTORY, kept because it is the reason this key exists. P0-A recorded this as
# a blocker: `SafetyEnvelope.person_social_zone_m` was the hardcoded 1.2 m and
# `ReactiveSafetyPolicy.__post_init__` floored the configured `person_stop_m`
# on it, so writing 0.7 here did not relax the robot — it stopped the prototype
# from BOOTING ("reactive person_stop_m must not undercut
# SafetyEnvelope.person_stop(0.0)"). The shipped commissioning value was its
# own floor. See scrum/20260822/task_1/P0A_STATUS.md and
# scrum/20260822/WAVE_P0_VERIFICATION_FABLE.md row A-1.
#
# WHAT CHANGED (card P1-E, scrum/20260822/task_12/P1E_STATUS.md): the SOURCE of
# that distance. `safety.person_stop_m` now COMMISSIONS the envelope's social
# zone (`SafetyEnvelope.with_person_social_zone`), and the floor underneath is
# the authority's named `PERSON_SOCIAL_ZONE_FLOOR_M` = 0.68 m — the Go2's own
# ISO/TS-15066 stopping distance at cruise (0.32 + 0.85*0.12 + 0.85^2/2.8).
# Below it the runtime REFUSES TO BOOT and names the floor. That refusal is the
# safety core and did not move; the gate's logic, the e-stop latch, the command
# TTLs and `finalize_command` carry zero diff lines.
#
# WHY 0.7 m INDOORS. E2-D2, measured: the dog travelled 0.31 m and stopped,
# because in an apartment the owner is ALWAYS inside a 1.2 m wedge
# (scrum/20260821/task_20/MOVE1_STATUS.md §1.4 — the arithmetic closes to
# 1.8 mm). 0.7 m is one arm's length: close enough to be a companion, 0.02 m
# above the floor the body can physically stop in.
safety:
  person_stop_m: 0.7

# The follow stand-off is DERIVED from the number above, but `configs/robot.yaml`
# pins `owner_follow.owner_keepout_m` as a LITERAL 1.75 (= the old 1.2 + the
# 0.55 owner collision envelope), and a literal does not re-derive. Left alone,
# the prototype would boot with a 0.7 m gate and still hold formation at 1.75 m
# of centre distance — the gate would be relaxed and the behaviour would not.
# 1.25 = 0.7 + 0.55 is exactly `RobotRuntime.__init__`'s `minimum_owner_keepout`
# for this profile; the follow stand-off then re-derives to
# 1.25 + OWNER_STAND_OFF_MARGIN_M = 1.35 m of centre distance.
owner_follow:
  owner_keepout_m: 1.25

# ---------------------------------------------------------------------------
# THE PROTOTYPE PERCEPTION STACK — ONE LINE AWAY, DELIBERATELY NOT TAKEN.
#
# Card P0-D shipped `configs/navigation/prototype.yaml` (default.yaml with the
# `perception.semantic_source` / `perception.abstention` block changed) and its
# header says: "Nothing selects this file by default. Point `navigation.config`
# at it in a robot profile to run the prototype perception stack." This is that
# robot profile, and this is the line:
#
#     navigation:
#       config: configs/navigation/prototype.yaml
#
# It is COMMENTED OUT, and the reason is P0-D's own header two paragraphs later:
# "Every threshold below is PROVISIONAL. None of them was derived on real
# frames... an operating point to MEASURE from, not a calibration to trust"
# (the bench it is read off scored 0/69 person recall on an untextured scene).
# Switching an unmeasured ABSTENTION gate on by default in the owner-facing
# profile risks a companion that refuses every place it is asked about, which is
# the opposite of this wave's ask-over-refuse directive — and it is a decision
# about P0-D's calibration, not about profiles, so P0-A does not get to make it
# silently. Verified that it is only a decision and not a defect: a runtime
# built with `navigation.config` pointed at that file constructs exactly as one
# pointed at default.yaml does.
#
# Uncomment when someone has measured it. See P0A_STATUS.md "Handoffs".

# ---------------------------------------------------------------------------
# VOICE IDENTITY — the key lives in the REALTIME config, not this one.
#
# The gate RobotRuntime._build_voice_identity_gate builds reads
# `voice_identity.enabled` from the hosted-lane YAML
# (parcel_robot.realtime.config), which is a different file with a different
# loader. The prototype's setting is therefore in
# configs/realtime.prototype.yaml.example, where it is `enabled: false` until
# the owner enrolls:
#
#     tools/enroll_owner_voice.py --wav a.wav b.wav c.wav d.wav e.wav
#     tools/enroll_owner_voice.py --show
#
# Nothing is written here for it on purpose: an unrecognised top-level key in
# robot.yaml is SILENTLY IGNORED by ConfigStore, so a `voice_identity:` block
# in this file would look like a setting and be nothing at all.

# ---------------------------------------------------------------------------
# ROAM — "go explore", and the four numbers that decide what that means.
# Card ROAM-1 (scrum/20260822/task_23/ROAM1_STATUS.md).
#
# The behavior is PatrolPolicy (src/parcel_robot/patrol/mission.py), driven by
# the runtime's own control loop and reached three ways: the spoken/typed
# closed intent ("go explore", "have a wander"), the hosted `roam` tool, and
# RobotRuntime.start_roam directly. It is owner-commanded only — `roam` is in
# realtime.config.PROACTIVE_MOTION_REFUSED, so no config can make the dog
# decide to leave on its own.
#
# This whole section is OPTIONAL. Every key below has a code default and the
# behavior works with the section absent; the base robot.yaml is SHA-locked and
# omits it, so the five paths are listed in config.OVERLAY_INTRODUCIBLE_KEYS.
#
# NOT HERE, on purpose: the two clearance thresholds. They are DERIVED from
# `safety.person_stop_m` and `safety.obstacle_stop_m` above by
# patrol.limits_from_safety, one named margin outside each, so the patrol can
# never be tuned INSIDE the gate that refuses it. Change the zone, not the
# patrol.
roam:
  # Default roam length when the owner does not say how long. Clamped to
  # [MIN_ROAM_BUDGET_S, MAX_ROAM_BUDGET_S] = [15, 600] by start_roam.
  # 120 s matches MOVE-1's measurement window, which is what makes the card's
  # three runs comparable with its 0.134 m baseline.
  budget_s: 120.0
  # Cruise speed while the lane ahead is clear, m/s. The reactive gate still
  # scales and stops this; it is a proposal, not a floor.
  cruise_vx: 0.25
  # Yaw rate while turning away from a blocked lane, rad/s.
  turn_vyaw: 0.8
  # Flip the turn direction when a turn RELEASES, so consecutive avoidance
  # turns alternate. Measured with it OFF: 21.85 m of path against 0.14 m of
  # net displacement — 3.90 full turns, all one way, a closed circle inside a
  # 1.8 x 2.2 m box. The dog was doing donuts. Leave this on.
  alternate_turns: true
  # How far from where it started a roam may wander, metres. Measured with it
  # absent: one run left the 24 x 24 m road plane at t = 85 s and drove
  # straight across the unfenced ground plane, banking 8.66 m of "net
  # displacement" off the rendered map. NOT a safety device — the reactive gate
  # is the only thing that refuses — it is a proposer bound that makes the dog
  # turn around, so "go explore" stays a wander around home.
  tether_m: 10.0
