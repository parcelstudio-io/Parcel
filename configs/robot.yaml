robot:
  model: go2

simulation:
  scene: src/parcel_robot/scenes/city_block.xml
  dynamic_city:
    enabled: true
    seed: 7
    speed_scale: 1.0

skills:
  root: configs/skills

navigation:
  enabled: true
  config: configs/navigation/default.yaml

perception:
  spatial_sensors: [camera, lidar]
  maps:
    provider: google_maps
    enabled: false  # placeholder only; no key, network request, or route authority

# Locally assembled context. Every provider and prompt field is opt-in.
query_context:
  enabled: false
  timeout_ms: 150
  max_age_s: 2.0
  timezone: America/New_York
  enable_location_context: false
  enable_time_context: false
  enable_map_context: false
  enable_scene_context: false
  include_precise_coordinates_in_prompt: false

spatial_behaviors:
  step_length_m: 0.25
  max_steps: 12
  default_orbit_radius_m: 1.6
  min_orbit_radius_m: 1.3
  max_orbit_radius_m: 2.0
  max_revolutions: 1.0
  owner_collision_envelope_m: 0.55
  orbit_clearance_margin_m: 0.10
  owner_anchor_tolerance_m: 0.60
  stall_timeout_s: 20
  timeout_s: 120

# "follow" keeps the legacy direct distance controller. "follow_behind" is an
# explicit camera-track formation: it needs two bounded owner-motion updates,
# stages around (never through) the owner, and holds if heading becomes stale.
owner_follow:
  behind_distance_m: 1.9
  owner_keepout_m: 1.55
  staging_radius_m: 2.1
  staging_lookahead_rad: 0.35
  heading_min_displacement_m: 0.08
  heading_min_speed_mps: 0.10
  heading_max_speed_mps: 3.0
  heading_smoothing_alpha: 0.35
  heading_min_updates: 2
  heading_stale_after_s: 0.8
  prediction_horizon_s: 0.25
  prediction_max_m: 0.25
  # Anticipatory following. The controller aims at where the Kalman filter
  # expects the owner to be in `lead_s`, and brakes translation as the
  # filter's windowed-NIS confidence falls: full speed at
  # `brake_full_confidence`, standstill at `brake_stop_confidence`. Unknown
  # keys in this block fail closed at startup.
  prediction:
    enabled: true
    lead_s: 0.6
    min_confidence: 0.45
    brake_full_confidence: 0.5
    brake_stop_confidence: 0.1

# Owner reacquisition (SearchOwner). The runtime proposes the skill after the
# follow controller has reported a lost owner for `lost_timeout_s`; the three
# states run under the same arbiter, reactive policy, and collision gate as
# every other behavior. Unknown keys here fail closed at startup.
owner_search:
  lost_timeout_s: 3.0
  max_search_s: 45.0
  arrival_radius_m: 0.5
  sweep_amplitude_rad: 2.0943951023931953  # +/-120 degrees
  sweep_rate_rad_s: 0.6
  # RPF-search reachability prune: the owner cannot have travelled further
  # than this from the loss point in the elapsed search time.
  owner_max_speed_mps: 1.6
  max_search_radius_m: 12.0
  sensor_radius_m: 3.0

metrics:
  max_turns: 200

# Battery telemetry. The simulator has no battery, so a simulated percentage
# keeps the brain's battery_critical procedures (ReturnToSafePose) reachable
# and testable; a hardware state source replaces this on a real robot.
battery:
  simulated_percent: 90.0
  low_threshold_percent: 20.0
  critical_threshold_percent: 8.0

# One process owns locomotion. The simulator adapter is used by the normal
# browser stack; parcel-unitree-control explicitly constructs unitree_sport.
control:
  controller: simulator
  control_hz: 50
  command_timeout_s: 0.35
  state_timeout_s: 0.25
  startup_timeout_s: 2.0
  stop_timeout_s: 1.0
  stop_retry_s: 0.2
  io_quiesce_timeout_s: 2.5
  stop_settled_samples: 2
  settled_linear_speed_mps: 0.08
  settled_yaw_speed_rad_s: 0.12
  max_tilt_rad: 0.75
  command_refresh_s: 0.2
  unitree_sport:
    interface: enp3s0  # replace with the dedicated robot Ethernet NIC on this host
    domain_id: 0
    state_topic: rt/sportmodestate
    rpc_timeout_s: 0.2
    command_refresh_s: 0.1
    enable_lease: true
    lease_acquire_timeout_s: 2.0
    axes_commissioned: false
    state_velocity_frame: odom  # verify against the connected firmware
    state_frame_commissioned: false
    lateral_sign: 1  # verify on a supported robot during commissioning
    yaw_sign: 1      # verify on a supported robot during commissioning
    # Empty fails closed. Populate only after checking this robot's firmware;
    # common Go2 candidates to verify are 0 (idle), 1 (stand), and 3 (move).
    allowed_modes: []

motion:
  backend: rl
  max_vx: 0.6
  max_vy: 0.4
  max_vyaw: 1.0
  smoothing:
    linear_accel: 0.9
    linear_decel: 1.4
    yaw_accel: 1.8
  # Jerk-limited actuator hand-off. This runs after the arbiter and the
  # collision gate, so safety sees the intent and the actuator sees the smooth
  # version; every stop path takes the shaper's emergency bypass and is never
  # smoothed. `calm_scale` is applied when measured vocal arousal is low.
  # Unknown keys fail closed at startup.
  shaping:
    enabled: true
    linear_max_accel: 1.2
    linear_max_jerk: 3.0
    yaw_max_accel: 2.4
    yaw_max_jerk: 6.0
    calm_scale: 0.6
    calm_below_arousal: 0.35
    arousal_valid_s: 20.0
  sport:
    enabled: false
    interface: lo
    domain_id: 1
  rl:
    enabled: true
    policy_path: ""
    control_dt: 0.02

language_model:
  enabled: true
  provider: llama_cpp
  base_url: http://127.0.0.1:8080
  model: gemma-4-26b-a4b
  timeout: 90
  streaming: true
  temperature: 0.25
  top_p: 0.9
  context_messages: 16
  context_char_budget: 12000
  max_tokens: 256
  enable_thinking: false
  # The same loaded Gemma backbone gets a separate, slower PlanIR contract.
  # It is selected only for deliberative physical tasks by the bounded router.
  plan_timeout: 90
  plan_max_tokens: 1024
  # Live testing showed the 1,024-token thinking budget could be exhausted
  # before any PlanIR was emitted. Constrained direct JSON is the safe default.
  plan_enable_thinking: false
  plan_temperature: 0.0
  max_stream_events: 4096
  max_response_bytes: 131072

agent:
  prompts_root: prompts
  personality: gentle_companion
  conversation_history_messages: 16
  functions: [companion, navigator, spatial_reasoner, manual_assistant]
  brain:
    enabled: true
    # Only semantic skills with runtime adapters and verified success checks.
    skills: [NavigateTo, FollowFormation, OrbitOwner, MoveRelative, Hold, Vocalize,
             AskClarification, ReturnToSafePose, Gesture]
    # Curated emote allowlist for the Gesture skill (bounded pose/trajectory
    # skills only; postural settling belongs to ReturnToSafePose). Unset uses
    # RobotRuntime.DEFAULT_EMOTES.
    emotes: [bow, hello_pose, hop, look_left, look_right, paw_wave, play_bow,
             shake, stretch]
    maximum_total_timeout_s: 600
    max_task_records: 256
  affect:
    minimum_confidence: 0.75
    social_action_cooldown_s: 8
    proposal_ttl_s: 20

# Speech services. `auto` uses whichever services are healthy and degrades to
# text mode otherwise; `audio` fails closed at startup if either role is
# unavailable. Piper is the on-device default per the 2026 research decision;
# Fish S2 (~24 GiB VRAM) remains an opt-in docked-mode upgrade.
speech:
  mode: auto
  stt_provider: whisper_cpp
  whisper_url: http://127.0.0.1:8178
  tts_provider: piper
  piper_binary: third_party/piper/piper
  piper_voice: models/piper/voice.onnx
  # piper_sample_rate_hz: 22050  # optional; auto-detected from <voice>.onnx.json
  fish_url: http://127.0.0.1:8091
  fish_reference_id: null
  # Physical audio devices. Unset uses the system default; set to a PortAudio
  # index or a case-insensitive substring of the device name (preferred for a
  # USB array whose index moves between reboots, e.g. "ReSpeaker").
  # List candidates: .parcel/bin/python -c "import sounddevice;
  #   print(sounddevice.query_devices())"
  # input_device: ReSpeaker
  # output_device: ReSpeaker
  # Turn segmentation. "energy" is the VAD-hangover default; "semantic" adds
  # Silero v6 framing + Smart Turn commit decisions and needs onnxruntime
  # plus the weights below (it degrades loudly to energy without them).
  endpointing: energy
  # vad_model: models/endpointing/silero_vad_v6.onnx
  # turn_model: models/endpointing/smart_turn_v3.onnx
  # Without acoustic echo cancellation, barge-in during robot speech requires
  # the microphone to hear the owner this many times louder than the VAD
  # threshold. Hardware AEC (XVF3800-class mic array) is the planned fix.
  echo_guard_scale: 2.5

# Expressive liveness: idle breathing/weight shifts plus conversation
# reactions (orient to the speaker, hold a thinking pose). Purely additive
# joint offsets, clamped in expression.py and gated off during skills,
# proximity events, critical battery, or a latched E-stop.
expression:
  enabled: true
  seed: 20260804
  # Expression runs on its own channel: beat-synced nods are judged against
  # the pitch accent they land on (<30 ms), which a 10 Hz control tick
  # cannot resolve. It decides nothing, so a faster rate costs no arbitration.
  rate_hz: 50
  idle:
    breathing_hz: 0.25
    breathing_amplitude_m: 0.004
  beats:
    # Raise lag_compensation_s on hardware once actuation lag is measured;
    # bias early, since motion-lead reads as anticipation and lag reads as
    # broken (ITU asymmetry: +45 ms undetectable, -125 ms detectable).
    lag_compensation_s: 0.0

# Dynamic prompting: sectioned context assembly + read-only information
# tools for the conversation model. Inspect/iterate at /api/prompt; add
# facts live via POST /api/prompt/fact {key, value} or runtime.set_user_fact.
prompting:
  enabled: true
  turn_budget_chars: 2000
  user_profile:
    location: New York
    home: Manhattan
    occupation: software engineer
  tools:
    weather: true

safety:
  obstacle_stop_m: 0.65
  obstacle_slow_m: 1.2
  person_stop_m: 1.0
  person_slow_m: 2.0
  telemetry_stale_s: 0.6
  # Predictive brake that *supplements* the geometric proximity gate. It runs
  # after the gate on the outgoing command and can only scale it down, so the
  # unconditional last line of defence is unchanged. Unknown keys fail closed.
  time_to_collision:
    enabled: true
    brake_s: 2.0
    stop_s: 0.8
    robot_radius_m: 0.35
    min_scale: 0.0

memory:
  path: parcel_memory.sqlite3

# Legacy inline poses kept as a shim; canonical skills live under configs/skills/.
poses: {}

wifi_cards:
  simulator:
    interface: lo
    ros_domain_id: 1
    purpose: simulation
  robot:
    interface: enp3s0
    ros_domain_id: 0
    purpose: physical_robot

modules:
  - name: status
    class: parcel_robot.modules.StatusModule
    enabled: true
    config:
      label: parcel-dog
