id: grid_v1
type: grid
version: "1.0.0"
description: Sensor-only rolling LiDAR occupancy map, A* route, and smooth waypoint controller.
checkpoint: ""
device: cpu
controller:
  cruise_vx: 0.85  # raised 2026-08-04 (was 0.60)
  # 28->55 (2026-08-05): curvature_scale (cos^2) already slows smoothly
  # through moderate heading error; the hard vx=0 align cut is reserved for
  # genuine corners. At 28 deg every waypoint flap triggered a full stop +
  # ~1 s re-align + ramp-from-zero, halving effective travel speed.
  align_enter_deg: 55.0
  align_exit_deg: 7.0
  max_yaw_rate: 0.90
  min_align_yaw_rate: 0.20
  yaw_gain: 1.40
  slowdown_radius_m: 2.0
  control_dt_s: 0.1
  max_linear_accel: 0.9
  max_yaw_accel: 1.8
  grid_resolution_m: 0.10
  grid_size_cells: 161
  map_safety_margin_m: 0.10
  lidar_range_cap_m: 12.0
  unknown_cost: 2.5
  lookahead_m: 0.90
  recovery_yaw_rate: 0.35
  recovery_reverse_vx: -0.12
  recovery_scan_steps: 30
  # The standard 270-degree LiDAR has a rear blind wedge, so autonomous
  # recovery scans in place and does not reverse into unobserved space.
  recovery_reverse_steps: 0
  replan_interval_steps: 5
  lidar_stride: 2
  # Predicted-occupancy penalty for tracked pedestrians/cyclists/vehicles.
  # Repeated A* at 10 Hz rebuilds this every tick, so no incremental replanner
  # is needed. The owner keeps a reduced weight: a follower that reads its own
  # owner as an obstacle wall cannot follow. Unknown keys fail closed.
  dynamic_agents:
    enabled: true
    weight: 2.5
    owner_weight: 0.6
    horizon_s: 2.0
    step_s: 0.2
    decay_half_life_s: 0.8
    sigma_m: 0.45
    window_radius_m: 6.0
rl:
  enabled: false
  trainable: false
  obs_keys: [goal_delta, odometry, lidar]
  action_space: mid_level_velocity
