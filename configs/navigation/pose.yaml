# Stratum-1 pose authority (Lane B). Consumed by `parcel_robot.pose`.
#
# This file configures a SEAM, not a localizer. There is no SLAM and no EKF in
# sim (STRATA_GENERALIZATION_PLAN anti-goals, binding). `truth` is the shipping
# default and is behavior-preserving by construction: both REP-105 frames return
# the identical sim-truth pose with zero covariance.
#
# The drift profiles exist so the MAP/ODOM frame binding can be *measured*.
# They are a stand-in for leg odometry, not a model of one.

provider: truth

profiles:

  # ---------------------------------------------------------------------
  # The plan's named defaults: alpha1..alpha4 = 0.2.
  #
  # These are a stated starting point, NOT a calibration. The closed form for
  # the ALONG-TRACK component alone on the canned 20 m trajectory at the sim's
  # 0.1 m step is sqrt(alpha3 * D * d) = sqrt(0.2 * 20 * 0.1) = 0.63 m = 3.2 %,
  # but the MEASURED end-of-path drift over 60 seeds is far larger because
  # heading error dominates (see the calibrated profile's note):
  #   translational  20.3 % of distance   [4.2 % .. 52.2 % across seeds]
  #   yaw             2.12 deg/m          [0.01 .. 6.24 across seeds]
  # That is ~20x the published Go2 band below, so this is a STRESS tier well
  # past the plan's "2 % stress" intent. It must never be tuned against and
  # must never be used as the T1 calibrated tier.
  # ---------------------------------------------------------------------
  stress:
    noise:
      alpha1: 0.2
      alpha2: 0.2
      alpha3: 0.2
      alpha4: 0.2
      seed: 20260807

  # ---------------------------------------------------------------------
  # T1 calibrated tier.
  #
  # Published band (DogLegs, leg odometry measured on a Unitree Go2):
  #   translational  0.5 - 1.0 % of distance travelled
  #   yaw            0.2 - 0.5 deg per metre travelled
  #
  # THE TWO PUBLISHED NUMBERS CANNOT BOTH DESCRIBE END-OF-PATH DRIFT ON THE
  # SAME 20 m RUN, and pretending otherwise would be a fabricated calibration.
  # Accumulated position error in any odometry model is dominated by heading
  # error, not by along-track error: a heading error theta carried over a
  # distance D contributes roughly D*theta/2 of cross-track displacement. At
  # the mid-band 0.35 deg/m that is 20 m * 0.061 rad / 2 = 0.6 m = 3 % over
  # 20 m -- already several times the 0.5-1 % translational band, before any
  # translational noise is added at all. Measured here: changing alpha3 by 10x
  # (0.01 -> 0.001) moves end-of-path drift by less than 1 % relative, which is
  # the same fact from the other side. The published translational figure is a
  # SHORT-SUB-SEGMENT relative error (KITTI-style RPE), not an accumulated one.
  #
  # So this profile calibrates to the band that actually governs the outcome
  # and is length-independent, and PINS the other as measured:
  #
  #  * yaw: `systematic_yaw_bias_sigma_rad_per_m` is the primary knob, because
  #    a per-run bias gives drift LINEAR in distance -- which is the shape a
  #    "deg per metre" spec asserts. A pure alpha random walk gives sqrt(D),
  #    whose deg/m figure is meaningless without stating D.
  #      E|bias| = sigma * sqrt(2/pi) = 0.798 * 0.0061 = 0.0049 rad/m
  #                                   = 0.28 deg/m  -> mid-band.
  #    Measured mean over 60 seeds: 0.378 / 0.311 / 0.275 deg/m at
  #    D = 10 / 20 / 40 m -- in band at every length.
  #
  #  * translational: `systematic_translation_scale_sigma = 0.0075` is the
  #    0.75 % mid-band SCALE error, which is the part of the translational
  #    spec this model can honor directly. The resulting ACCUMULATED
  #    end-of-path drift is measured at 1.5 / 2.3 / 3.9 % of distance at
  #    D = 10 / 20 / 40 m -- above the published band, for the heading-
  #    dominance reason above. That number is pinned as MEASURED, not claimed
  #    as calibrated.
  #
  #  * alphas stay small and non-zero so runs differ from each other
  #    stochastically rather than only by their drawn bias.
  #
  # tests/test_pose_drift_calibration.py measures all of this over 60 seeds and
  # reddens if either band is left. It is a calibration check, not a
  # capability claim: this is a stand-in for leg odometry, not a model of one.
  # ---------------------------------------------------------------------
  calibrated_go2:
    noise:
      alpha1: 0.002
      alpha2: 0.001
      alpha3: 0.003
      alpha4: 0.001
      systematic_translation_scale_sigma: 0.0075
      systematic_yaw_bias_sigma_rad_per_m: 0.0061
      seed: 20260807

  # Same calibrated noise, but MAP re-anchors instead of passing truth through:
  # MAP follows ODOM and snaps back to truth every interval_s. This is the only
  # way to exercise the "MAP may jump" half of REP-105. Off by default.
  calibrated_go2_reanchoring:
    noise:
      alpha1: 0.002
      alpha2: 0.001
      alpha3: 0.003
      alpha4: 0.001
      systematic_translation_scale_sigma: 0.0075
      systematic_yaw_bias_sigma_rad_per_m: 0.0061
      seed: 20260807
    map_correction:
      enabled: true
      interval_s: 5.0

  # Test hooks. TruthPoseProvider can NEVER report anything but HEALTHY; these
  # profiles are the only way LOST/DEGRADED reaches a consumer today.
  lost:
    noise:
      alpha1: 0.002
      alpha2: 0.001
      alpha3: 0.003
      alpha4: 0.001
      seed: 20260807
    health:
      force: lost

  degraded:
    noise:
      alpha1: 0.002
      alpha2: 0.001
      alpha3: 0.003
      alpha4: 0.001
      seed: 20260807
    health:
      force: degraded

  # =====================================================================
  # DEGRADED-POSE EVAL TIERS (DR-1, scrum/20260811/task_2).
  #
  # The standing degraded-pose eval arms need a LADDER, not one point. The
  # nominal rung already exists and is NOT duplicated here: the nominal tier
  # IS `calibrated_go2` above, whose derivation block is the provenance for
  # all three rungs. (There is deliberately no `go2_nominal` alias --
  # copying those seven constants into a second entry would create two
  # things that must be kept equal, and the plan says nominal is
  # calibrated_go2 *verbatim*.)
  #
  # HOW THE TWO NEW RUNGS ARE DERIVED. Not by inventing a second citation --
  # no published slip-rate or degraded-terrain drift figure for the Go2
  # exists in the sources this repo cites, and fabricating one would be
  # worse than admitting the choice. Instead each rung is a STATED MULTIPLE
  # `k` of the calibrated sigma, so the single published anchor (DogLegs,
  # 0.5-1.0 % distance RPE / 0.2-0.5 deg/m yaw) governs the whole ladder:
  #
  #     go2_aggressive  k = 2      go2_degraded  k = 4
  #
  # and the TARGET BAND for each rung is `k x the published band`. The
  # multiplier is an engineering tier choice, stated as such; the bands it
  # implies are then MEASURED over 60 seeds by the existing harness in
  # tests/test_pose_drift_calibration.py, which is what makes the tier real
  # rather than asserted.
  #
  # THE k^2 ON THE ALPHAS IS NOT A TYPO. alpha1..4 are VARIANCE
  # coefficients (pose.py:246 -- sampled sigma of a straight d-metre
  # increment is sqrt(alpha3)*d), so scaling sampled sigma by k requires
  # scaling the alphas by k^2. The two systematic sigmas are already
  # standard deviations and scale by k directly. Getting this backwards
  # would make "2x" mean 1.41x.
  #
  # MEASURED, 60 seeds, canned square circuit (D = 10 / 20 / 40 m):
  #
  #   profile          yaw deg/m            scale-only %   accum % @ 20 m
  #   calibrated_go2   0.368/0.315/0.274        0.641           2.30
  #   go2_aggressive   0.737/0.629/0.548        1.282           4.59
  #   go2_degraded     1.557/1.239/1.197        2.563           9.22
  #   stress           (pinned above)                          20.3
  #
  # Every rung sits inside its own k x DogLegs band at every length, and the
  # ladder is strictly monotone in both metrics -- calibrated < aggressive <
  # degraded < stress -- so the two new tiers genuinely INTERPOLATE between
  # the two anchors this repo already owned. As with calibrated_go2, the
  # accumulated end-of-path percentage is pinned as MEASURED, not claimed to
  # match the published translational band: heading error dominates it, for
  # exactly the reason derived in the calibrated_go2 block above.
  #
  # These tiers must never be tuned against a downstream eval gate.
  # =====================================================================

  go2_aggressive:
    noise:
      # k = 2. alphas x k^2 = x4; systematic sigmas x k = x2.
      alpha1: 0.008
      alpha2: 0.004
      alpha3: 0.012
      alpha4: 0.004
      systematic_translation_scale_sigma: 0.015
      systematic_yaw_bias_sigma_rad_per_m: 0.0122
      seed: 20260807

  # k = 4, plus the one error source the alpha model structurally cannot
  # express: discrete FOOT SLIP. A leg loses traction, the body moves, the
  # kinematic chain reports it did not, and the estimate takes a step
  # displacement that no amount of Gaussian increment noise reproduces.
  #
  # The two slip constants are a declared TIER CHOICE with a stated intent,
  # not a measurement (see above -- no published Go2 slip rate to cite):
  #   * magnitude 0.15 m ~ one Go2 stride at the ~1 m/s eval cruise, i.e.
  #     one fully-slipped stance phase mis-integrated.
  #   * rate 0.05 /m = one expected event per 20 m, i.e. ~one observable
  #     discrete jump per travel-heavy episode -- frequent enough to be
  #     exercised, rare enough to stay a jump rather than a second noise
  #     floor.
  # MEASURED mean events over 60 seeds: 0.57 / 1.13 / 2.15 at D = 10/20/40 m,
  # matching the intended one-per-20-m rate. `DriftingOdomProvider.
  # slip_events` exposes the count so an eval row can prove it fired.
  go2_degraded:
    noise:
      alpha1: 0.032
      alpha2: 0.016
      alpha3: 0.048
      alpha4: 0.016
      systematic_translation_scale_sigma: 0.030
      systematic_yaw_bias_sigma_rad_per_m: 0.0244
      slip_jump_magnitude_m: 0.15
      slip_jump_rate_per_m: 0.05
      seed: 20260807

  # ---------------------------------------------------------------------
  # SCHEDULED LOST WINDOWS THAT RECOVER.
  #
  # Distinct from the `lost` profile above (permanently forced) and from
  # `health.lost_after_s` (a one-way trapdoor): these drop out and COME
  # BACK, which is the only way to exercise a consumer's re-acquisition
  # path. Drift keeps accumulating through the window -- a localizer
  # announcing it is lost does not stop the legs.
  #
  # WINDOW DERIVATION (start_s 4.0, duration_s 3.0). The travel-heavy eval
  # cells run ~12 m at the ~1 m/s cruise the harness assumes (0.1 m per
  # 0.1 s tick) = ~12 s of travel. To prove RECOVERY and not merely the
  # drop, the episode must contain healthy operation before AND after the
  # window, so split the shortest such episode in three: 4 s healthy
  # lead-in, 3 s LOST, ~5 s recovered. The 3 s duration is 30 ticks at the
  # 10 Hz control rate, so the LOST hold is held across many ticks rather
  # than being a single-tick blip a consumer could miss.
  #
  # If a DR-2 substrate is materially shorter than ~10 s of travel this
  # window stops being derivable and needs a DR-1 handoff, not a local edit.
  #
  # Each `_lost` variant repeats its base profile's noise block verbatim.
  # That duplication is deliberate and forced: the base profiles are
  # byte-frozen, so a yaml anchor would require editing them. It follows the
  # precedent `calibrated_go2_reanchoring` already set in this file, and
  # tests/test_pose_degraded_profiles.py asserts each variant's parsed noise
  # is EQUAL to its base -- so the copies cannot silently drift apart.
  # ---------------------------------------------------------------------
  calibrated_go2_lost:
    noise:
      alpha1: 0.002
      alpha2: 0.001
      alpha3: 0.003
      alpha4: 0.001
      systematic_translation_scale_sigma: 0.0075
      systematic_yaw_bias_sigma_rad_per_m: 0.0061
      seed: 20260807
    health:
      lost_windows:
        - start_s: 4.0
          duration_s: 3.0

  go2_aggressive_lost:
    noise:
      alpha1: 0.008
      alpha2: 0.004
      alpha3: 0.012
      alpha4: 0.004
      systematic_translation_scale_sigma: 0.015
      systematic_yaw_bias_sigma_rad_per_m: 0.0122
      seed: 20260807
    health:
      lost_windows:
        - start_s: 4.0
          duration_s: 3.0

  go2_degraded_lost:
    noise:
      alpha1: 0.032
      alpha2: 0.016
      alpha3: 0.048
      alpha4: 0.016
      systematic_translation_scale_sigma: 0.030
      systematic_yaw_bias_sigma_rad_per_m: 0.0244
      slip_jump_magnitude_m: 0.15
      slip_jump_rate_per_m: 0.05
      seed: 20260807
    health:
      lost_windows:
        - start_s: 4.0
          duration_s: 3.0

# Chance-constrained region membership (stratum 1, "where polygons remain
# legitimate"). P(inside) >= threshold replaces the boolean test ONLY when the
# pose covariance is non-zero; at zero covariance the predicate short-circuits
# to the identical boolean geometry, so TruthPoseProvider results are
# bit-identical to the pre-seam system.
chance_constrained:
  inside_probability_threshold: 0.9
