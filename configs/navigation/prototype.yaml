# PROTOTYPE navigation profile for Parcel — card P0-D (scrum/20260822/task_4).
#
# This file is `configs/navigation/default.yaml` with EXACTLY ONE BLOCK CHANGED
# (`perception.semantic_source` and `perception.abstention`); everything else is
# a byte-for-byte copy, and `tests/test_p0d_navigation_unblocks.py` pins that so
# the copy cannot silently drift from the shipping profile.
#
# Nothing selects this file by default. Point `navigation.config` at it in a
# robot profile to run the prototype perception stack. `default.yaml` does not
# move, so the frozen `nav_instruct` v4 baseline cannot move either.
#
# What it turns on, and why it is two changes and not one:
#
#   * `semantic_source: learned_map` — candidates come from C-2's
#     OnlineSemanticMap, which is the only source that carries the per-place
#     evidence (label support, evidence frames, ground fraction) the abstention
#     gate reads. The MuJoCo oracle carries none of it, so an ENABLED gate over
#     oracle candidates refuses every place; enabling abstention without also
#     moving the source is a profile that cannot navigate.
#   * `abstention.enabled: true` with a THREE-signal set and the label-strength
#     ranking margin. See the block itself.
#
# Every threshold below is **PROVISIONAL**. None of them was derived on real
# frames: they are read off the 2026-08-21 retrieval bench, which ran on an
# untextured scene (`scrum/20260821/perception/SYNTHESIS.md` §2: 0/69 person
# recall across three detectors). They are an operating point to MEASURE from,
# not a calibration to trust.

# Active city-navigation stack for Parcel.
# Full MetaUrban city + pedestrians require a Conda Python 3.9 + GPU host.
# See docs/NAVIGATION_CITY.md.

# grid_v1: rolling occupancy grid + A* over the calibrated raycast scan.
# Degrades loudly (scan_missing_fallback note + warning log) to the point-goal
# stub if the scan contract is absent.
active_model: grid_v1
models_root: configs/navigation/models
pois_path: configs/navigation/cities/demo_pois.yaml

metaurban:
  enabled: false
  density_ped: 1.0
  density_obj: 0.4
  mode: social_nav   # point_nav | social_nav

# Unknown semantic targets rotate in place and must be observed repeatedly
# before any translation is authorized.
semantic_search:
  max_steps: 80
  yaw_rate: 0.35

# Re-ground a semantic target when the body makes no meaningful goal progress.
# At the 10 Hz runtime rate this is 20 s, allowing a bounded obstacle detour;
# two fresh camera/LiDAR plans are allowed before the mission fails closed.
# 400->200 (2026-08-05): 40 s windows let the crawl/lease-lapse pathology idle
# through most of the 240 s step budget; 20 s still allows a 9 m detour at
# 0.45 m/s, more than this block ever needs, and makes stalls self-reporting.
progress_watchdog:
  timeout_steps: 200
  max_semantic_replans: 2

# Once the geometric goal is reached, request a locomotion stop and wait for
# fresh measured-velocity confirmation before declaring semantic success.
terminal_verification:
  stop_timeout_steps: 30

# Stratum-2 perception noise ladder (docs/STRATA_GENERALIZATION_PLAN.md).
# The detection_adapter perception chain is the ONE semantic-candidate ingress
# on the mission path; this block chooses which rung it runs at.
#
#   T0  pass-through / clean — THE DEFAULT. The structural round-trip runs, no
#       RNG is drawn, no row is dropped, and every reconstructed row is the
#       caller's own object. Byte-identical to the pre-chain oracle read, and
#       proven so (empty NAV_INSTRUCT minival diff, LANE_D_STATUS.md).
#   T1  calibrated — every constant datasheet-traceable, none tuned:
#         * range sigma  = 1.25e-3 * z^2 m   (D455: baseline 0.095 m, f 674.4 px
#           at 1280 px / 87 deg HFOV, 0.08 px sub-pixel sigma -> 0.02 m at 4 m,
#           i.e. 0.5 % RMS, consistent with the datasheet "<2 % at 4 m" bound)
#         * bearing sigma = 1.0e-2 rad (2 px centroid = 3.0e-3 rad, widened for
#           box jitter under partial occlusion — widened, not derived)
#         * dropout       = 0.1 at <=1.5 m rising linearly to 0.3 at >=8 m
#         * false positives = 1.0 per 100 frames (published band 0.5-2.0)
#         * confidence    = overlapping TP N(0.75, 0.12) / FP N(0.55, 0.15),
#           scaled by `temperature`; the literal 0.98 is gone
#
# T1 is MEASUREMENT, NOT A GATE (plan, eval instrument 2). Never tune against it.
perception:
  tier: T0
  seed: 20260807

  # Card C-3 (scrum/20260821/task_13/) — WHERE semantic candidates come from.
  #
  # This is a DIFFERENT AXIS from `tier` above, and the two must never be
  # conflated. `tier` chooses how much sensor noise is applied to whatever
  # candidates arrive; both of its rungs read the MuJoCo ground-truth oracle.
  # `semantic_source` chooses whose map answers "where is the bench".
  #
  #   oracle       THE DEFAULT. The GT read, unchanged and byte-identical to
  #                everything before this card. `extract_city_semantics` /
  #                `visible_city_semantics` with their stamped 0.98.
  #   learned_map  C-2's OnlineSemanticMap is the ONLY candidate source. The
  #                card calls this "T1". Confidences are earned from evidence
  #                counts and label purity; there is no 0.98. The scene sidecar
  #                is not read, so the "go to Narnia" refusal stops being a
  #                property of a declared label set and becomes a property of
  #                what the robot has actually seen.
  #   shadow       The card's "T0_shadow_T1". The oracle DRIVES; the learned map
  #                answers beside it and every disagreement is classified
  #                {benign_miss, localization_delta, admission_flip,
  #                refusal_flip} and logged with the frames that produced it.
  #                Behaviourally identical to `oracle` — it is a measuring
  #                instrument, not a deployment mode.
  #
  # `T1` is REFUSED here, loudly, and that refusal is deliberate: T1 is a
  # registered *tier* name (see REGISTERED_TIERS) and a config that wrote it
  # under this key while meaning "read the learned map" would silently get the
  # oracle with a noise ladder on top. Write `learned_map`.
  #
  # Off-oracle this ALSO empties the demo_pois.yaml POI table. `PlaceGrounder`
  # fires before semantic search and grounds "coffee shop"/"crosswalk"/"park"/
  # "bookstore" to hardcoded coordinates; it is a second oracle, and a mission
  # that "succeeds" through it under `learned_map` has measured a lookup table.
  # See scrum/20260821/cutover_research/res_design_review.md F1.
  #
  # Unknown keys starting `semantic_source` are a hard error, for the same
  # reason the abstention block below makes them one.
  # PROTOTYPE (P0-D): the learned map, not the MuJoCo oracle. See the header —
  # the abstention block below reads evidence the oracle does not carry.
  semantic_source: learned_map

  # Card P1-B (scrum/20260822/task_7/) — THE MAP THAT LEARNS.
  #
  # `semantic_source` above decides whether the learned map is READ. This block
  # decides what happens to the map the robot WRITES while it runs, which until
  # this card was nothing at all: the online semantic map had zero product
  # writers, and every entry any run produced died with the process.
  #
  # Present only when `semantic_source` is `learned_map` or `shadow`; under
  # `oracle` the runtime never constructs a map and this block is inert.
  # Unknown keys here are a HARD ERROR, same reason as the abstention block: a
  # typo'd key that reads as "the default" is a switch that never flipped.
  online_map:
    # Write the map to its store in `close()`. THE line that makes a parameter
    # persist from the robot's own experience rather than from a person's file.
    #
    # WHERE it writes is NOT here and deliberately cannot be: the store path is
    # `PARCEL_ONLINE_MAP_PATH` (absolute, or `:memory:`), resolved by C-2's own
    # R27 gate, which refuses a relative path and refuses the owner's
    # conversation store BY IDENTITY. With no env var there is no store, this
    # key has nothing to write to, and the runtime says so in the log and in
    # `learned_map_snapshot()["store_note"]` instead of inventing a temp file.
    persist_on_close: true
    # Read it back on start. This is "the dog that walked yesterday knows the
    # lamppost today", and turning it off is how you get a fresh map without
    # deleting the old one.
    reload_on_start: true
    # Card P1-B work item 4 — what the detector is ASKED, off-oracle.
    #
    # The batch handed to the camera at attach is:
    #     perception.camera_ingress_queries   (the operator's batch, pinned)
    #   + known_places()                      (below, if true)
    #   + curiosity_queries                   (below)
    # and CameraIngress caps the union at 16 phrases with `person` first,
    # counting and logging anything it drops. A batch over 16 used to make
    # every frame fail construction and blind the detector in silence
    # (refutation D-R2); it now degrades visibly instead.
    #
    # `known_places` is the confirm-what-you-know half: a robot that has
    # learned "bench" keeps asking about benches, so the entry either gains
    # evidence or decays honestly. Set false to ask only the fixed lists.
    query_batch_from_known_places: true
    # The oracle arm's half of work item 4, and it is OFF here too — because it
    # is measured. Under `oracle` the batch would become the scene sidecar's
    # own `detector_query_set()`, which is the vocabulary the scene ADMITS to
    # having rather than a list somebody typed twice. For `city_block` that is
    # 34 phrases: the cap keeps 16 and logs the 18 it drops, and the resulting
    # frames then run hard into `camera_ingress_max_detections_per_frame`. Two
    # 25 s oracle runs, same scene, same budget, differing in this one key
    # (scrum/20260822/task_7/evidence/p1b_oracle_sidecar_batch vs p1b_flag_off):
    #
    #     sidecar batch ON : 632 of 1,016 detections TRUNCATED (62.2%)
    #     operator's batch :  57 of   404 detections truncated (14.1%)
    #
    # Under `oracle` the camera grounds nothing (the GT oracle supplies the
    # candidates), so that cost buys a longer diagnostic stream and no product
    # behaviour. It is off, and the shipped default's batch is exactly
    # `perception.camera_ingress_queries`, byte-identical to before card P1-B.
    # Turn it on to measure the sidecar vocabulary against a real detector;
    # raise `camera_ingress_max_detections_per_frame` first or most of it is
    # dropped.
    oracle_query_batch_from_scene: false
    # The explore half: things worth asking about that the map has never seen.
    # Kept SHORT on purpose — every phrase is detector cost on a budget that is
    # already 16 wide and already carrying the operator's batch.
    curiosity_queries: [bench, tree, bicycle rack]
    # Prefix for the visit id every observation this run is stamped with.
    # Distinct visits are what the k-gate counts and what decay measures, so a
    # run that reused another run's visit id would make three frames of one
    # stare look like three independent confirmations.
    visit_id_prefix: patrol

  # Widens both confidence distributions; 1.0 is the calibrated shape.
  confidence_temperature: 1.0
  # Arrival evidence threshold on the MEAN detection score across confirming
  # frames. `null` = use the goal's own minimum_confidence (0.55), which is the
  # value the system already used, so T0 cannot move. The calibrated T1 value
  # from the known-absent trials is recorded in LANE_D_STATUS.md.
  arrival_confidence_threshold: null

  # Card PG-3 (scrum/20260821/task_8/PG3_STATUS.md) — CALIBRATED ABSTENTION.
  #
  # R20 refuses "go to Narnia" because the chain checks a CLOSED LABEL SET from
  # the simulator's scene sidecar. Delete the labeled world and that honesty
  # disappears with it: the 2026-08-21 mapping bench measured SigLIP-2 text->
  # place cosine at 0.049-0.135 for present queries and 0.054-0.107 for absent
  # ones, so NO threshold separates them and "Narnia" would send the robot to
  # (-3.19, 4.10). This block is the perception-side replacement — a verdict
  # earned from detector-label agreement, evidence count, navigability and a
  # ranking margin instead of from a list the world file happened to declare.
  #
  # OFF, and it must stay off until the world work lands. Every threshold below
  # was fitted on a held-out split of an UNTEXTURED scene in which three
  # detectors score 0/69 person recall (SYNTHESIS.md 2), so the numbers are
  # provisional and the measured false-reject rate is 73% (11/15 EVAL present
  # queries) — every one of them a class the detector could not see, not a
  # failure of the gate. Turning this on today would refuse almost everything.
  #
  # Turning it on is a config change, not a code change: that is the point.
  # Unknown keys under this block are a hard error, because a typo'd safety
  # flag that reads as "default" looks exactly like a gate that never fires.
  abstention:
    # PROTOTYPE: ON. Card P0-D, owner directive 2026-08-22 ("loosen up
    # production fail-safe logic", ask over refuse).
    enabled: true
    # WHICH gates run. Absent == all six (the shipping set). This profile keeps
    # the three that the online map can actually evidence and drops the three
    # that it cannot:
    #
    #   kept    label_support   is this place that kind of thing
    #           evidence_count  did the robot see it more than once
    #           ranking_margin  is the winner decisively the winner
    #   dropped label_probability / label_frames — the per-prompt detector
    #           column is not persisted per place by C-2's ingest, so the gate
    #           would refuse on "never asked" for terms the robot did see.
    #           NOTE this also drops the "the detector was never asked" refusal;
    #           an absent query still refuses, but as `no_observations`.
    #   dropped navigability — C-2 measures ground fraction from robot
    #           traversal, which is 0.0 for anything the dog has not walked
    #           past. It is the gate that refuses "the moon", and dropping it is
    #           the loosening this profile is FOR: re-enable it once depth
    #           returns populate `ground_evidence_fraction` for real.
    #
    # CARD P1-D adds a fourth: `vlm_veto`. It is the only signal that LOOKS at
    # the place. Qwen3-VL-2B is shown the top candidate's best-view crop and the
    # query noun, and an "absent" answer removes the admission. It runs LAST,
    # only on a place that already passed every evidence gate, and it is
    # subtractive only — so a hallucinating verifier costs a question and never
    # a place the evidence did not earn.
    #
    # It is the only signal that can be UNAVAILABLE at call time (no seat
    # installed on this host, no crop on this entry, or the contention guard
    # declining the GPU moment). Unavailable degrades to ASK, never to ADMIT and
    # never to REFUSE — which is why `ask_below_threshold` below is not optional
    # here but a construction invariant of the policy.
    signals: [label_support, evidence_count, ranking_margin, vlm_veto]
    # CARD P1-D — THE POSTURE. This is the key the whole card is about.
    #
    # C-3 measured 0/18: the gate refused every learned-map answer on
    # perfect-geometry data. Six AND-ed thresholds fitted on a world SYNTHESIS
    # 2 declared invalid can only ever say no, and a dog that says no to
    # everything is not being careful, it is being useless.
    #
    # With this true, a SHORTFALL against one of those provisional thresholds
    # becomes a question — "I think it's over there, want me to go?" — instead
    # of a refusal. `admitted` still means what it always meant, so an ASK
    # authorizes no motion whatsoever; what changes is what the owner hears.
    #
    # What does NOT soften, and each for a reason that is not a threshold:
    #   no_observations      no candidate exists; there is nothing to ask about
    #   no_detector_support  the label head never answered; "shall I go to the
    #                        thing I have no evidence of" is a guess with a
    #                        question mark on it
    #   not_navigable        a physical claim. This is the gate that refuses
    #                        corpus row 12 ("take me to the moon") and softening
    #                        it would hand that row back
    #   vlm_veto_absent      something LOOKED and said no
    ask_below_threshold: true
    # CARD P1-D — WHICH seat answers the veto. This is the key that makes the
    # signal above do anything: without it the roster selects a gate that
    # resolves to no verifier, answers `unavailable` for every place, and the
    # dog asks about everything. (That was literally the shipped behaviour until
    # the P1-D verifier caught it: the veto had a keyword argument and no
    # producer.)
    #
    # The weights are NOT a repo dependency. `.parcel` carries no tensor library
    # and this profile does not add one, so on a host without torch the seat
    # fails to warm, declares itself cold, and the gate ASKS. Loud in the log,
    # a question to the owner, never a wrong admission and never a blanket
    # refusal. Set to `null` to choose that posture deliberately.
    veto_model: Qwen/Qwen3-VL-2B-Instruct
    # PROVISIONAL. The robust z-score is structurally 0.0 on this map's own
    # background (one non-zero score among zeros => MAD 0 => margin 0 => every
    # query indecisive; measured 0/6 and 0/18). `label_strength` is the
    # top-vs-second label-strength ratio the 2026-08-21 retrieval bench found
    # separable: corroborated 2.8-8.2, stray single-detection 0.12.
    ranking_margin_mode: label_strength
    # Not read under this signal set; left at PG-3's fitted values so
    # re-enabling a signal is a one-word edit.
    min_label_probability: 0.25
    min_label_frames: 1
    # PROVISIONAL. Unchanged from PG-3's fitted value: a place whose detections
    # mostly call it something else is not that place.
    min_label_purity: 0.5
    # PROVISIONAL, LOOSENED 7 -> 3. Seven distinct frames is a value fitted on a
    # 120-frame archived sweep; a dog exploring in real time meets a place three
    # times before it is worth naming. Not derived on real frames.
    min_evidence_frames: 3
    # Not read under this signal set.
    min_ground_evidence_fraction: 0.08
    # PROVISIONAL. On the label-strength scale this is a RATIO, not a z-score:
    # the winner must be 1.5x the best alternative. A lone stray scores exactly
    # 1.0 (refused) and a lone corroborated place scores 23-68 (admitted); two
    # places within 1.5x of each other read as genuinely indecisive and the
    # robot asks instead of guessing. Not derived on real frames.
    min_ranking_margin: 1.5
    # DERIVED, not fitted: the Go2's own eye height, camera_channel.d455
    # MOUNT_HEIGHT_M. Changing it is a claim about the robot, not a tuning knob.
    ground_band_m: 0.35
    # How many real places a refusal names. R20's PLACE_OFFER_LIMIT.
    offer_limit: 3

# Card RM-2 (scrum/20260811/task_2/SLAM_M_PLAN.md). Route memory on the product
# path: the robot remembers routes it has actually driven (a MAP-frame place
# graph of recorded edges) and, when the global planner has PROVED it cannot
# route to a committed goal that lies beyond its ~8 m rolling window, consults
# that memory for an interim waypoint instead of blacklisting the target.
#
# OFF by default and byte-identical off. Flag-ON adds no motion authority: the
# waypoint is an SE2Goal proposal resolved by GoalArbiter (TTL / stale-revision
# / LETHAL vetoes unchanged), grid_v1 + the reactive gate still own every
# velocity, and K0 at the TRUE goal remains the only arrival. Memory that has no
# recorded route answers with an empty tuple and the whole path is inert.
route_memory: false

safety:
  # 0.45->0.9 (2026-08-05): completes the 2026-08-04 speed raise that touched
  # grid.yaml cruise_vx (0.85) and robot.yaml motion.max_vx (1.0) but missed
  # this clamp, silently capping clear-path speed at 0.45. The runtime
  # reactive gate, TTC gate, and arbiter SafetyLimits still bound the
  # actuator; predictive_mode below keeps braking speed-proportional.
  max_vx: 0.9
  max_vy: 0.25
  max_vyaw: 0.8
  stop_distance_m: 0.8
  # projected_speed_cap (2026-08-05): proportional directional cap reaching 0
  # exactly at stop_distance_m, replacing the fixed slow_scale=0.35 cliff and
  # the stop/creep limit cycle it caused at the 0.8 m boundary. The hard stop
  # boundary itself is unchanged.
  predictive_mode: projected_speed_cap
  # DIVERGENCE, DOCUMENTED (2026-08-11, DOC-1). This planner-side people-cost
  # band no longer matches the runtime reactive person band: the owner-authorized
  # E5 retune (2026-08-10) moved `configs/robot.yaml` safety.person_slow_m
  # 2.0 -> 2.5 (SafetyEnvelope.person_comfort_band_m; see
  # scrum/20260809/task_15/E5_PERSON_CLEARANCE_STATUS.md). The prior comment here
  # asserted a match that has not held since. The value below is INTENTIONALLY
  # left at 2.0 for this batch: moving it moves frozen v3/v4 nav_instruct rows,
  # so alignment is an owner decision, tracked as OPEN QUESTION 6 in
  # scrum/20260811/task_1/FOLLOWUP_DESIGNS.md §8. Consequence while it stands: a
  # pedestrian at 2.0-2.5 m is slow-banded by the runtime gate but carries no
  # planner-side people cost.
  person_slow_m: 2.0
  people_cost_weight: 1.0
  obstacle_cost_weight: 1.0
