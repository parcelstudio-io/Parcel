# EXPERIMENTAL, deployment-disabled BARN/Go2-compatible local-safety candidate.
#
# This is the selected grid_v1 profile with one isolated change: predictive
# speed is capped by the LiDAR obstacle's positive closing component. The hard
# 0.10 m map inflation, 0.38 m stop boundary, 0.60 m/s velocity limit, zero
# reverse recovery, and production defaults are unchanged.
active_model: grid_v1
models_root: configs/navigation/models
pois_path: configs/navigation/cities/demo_pois.yaml

semantic_search:
  max_steps: 80
  yaw_rate: 0.35

progress_watchdog:
  timeout_steps: 800
  max_semantic_replans: 2

terminal_verification:
  stop_timeout_steps: 30

safety:
  max_vx: 0.60
  max_vy: 0.40
  max_vyaw: 1.0
  stop_distance_m: 0.38
  obstacle_slow_m: 0.75
  slow_scale: 0.45
  reaction_time_s: 0.12
  predictive_mode: projected_speed_cap
  people_cost_weight: 1.0
  obstacle_cost_weight: 1.0
