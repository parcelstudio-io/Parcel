# EXPERIMENTAL, deployment-disabled bounded-detour frontier challenger.
#
# Relative to frontier v3, this profile changes only the fallback used when no
# observed frontier makes immediate Euclidean goal progress. It may travel at
# least 0.60 m to a hard-safe observed frontier while temporarily increasing
# goal distance by at most 1.50 m. A selected detour route is held while the
# robot aligns, but every new scan can still invalidate it. Goal/odometry/
# 270-degree LiDAR/clock remain the only policy inputs. It does not reverse,
# strafe, weaken map inflation, or change production defaults.
active_model: grid_frontier_detour_v4
models_root: configs/navigation/models
pois_path: configs/navigation/cities/demo_pois.yaml

semantic_search:
  max_steps: 80
  yaw_rate: 0.35

progress_watchdog:
  timeout_steps: 800
  max_semantic_replans: 2

terminal_verification:
  stop_timeout_steps: 30

safety:
  max_vx: 0.60
  max_vy: 0.40
  max_vyaw: 1.0
  stop_distance_m: 0.38
  obstacle_slow_m: 0.75
  slow_scale: 0.45
  reaction_time_s: 0.12
  predictive_mode: projected_speed_cap
  people_cost_weight: 1.0
  obstacle_cost_weight: 1.0
