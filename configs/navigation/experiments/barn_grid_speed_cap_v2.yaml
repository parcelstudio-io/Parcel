# EXPERIMENTAL, deployment-disabled control for the projected-cap ablation.
# Identical to the selected grid_v1 profile except for the existing conservative
# total-speed predictive cap. Production defaults and hard margins are unchanged.
active_model: grid_v1
models_root: configs/navigation/models
pois_path: configs/navigation/cities/demo_pois.yaml

semantic_search:
  max_steps: 80
  yaw_rate: 0.35

progress_watchdog:
  timeout_steps: 800
  max_semantic_replans: 2

terminal_verification:
  stop_timeout_steps: 30

safety:
  max_vx: 0.60
  max_vy: 0.40
  max_vyaw: 1.0
  stop_distance_m: 0.38
  obstacle_slow_m: 0.75
  slow_scale: 0.45
  reaction_time_s: 0.12
  predictive_mode: speed_cap
  people_cost_weight: 1.0
  obstacle_cost_weight: 1.0
