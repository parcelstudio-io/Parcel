# Low-viewpoint gate pack sample configs (sim / synthetic metrics only).
# Passing these does NOT prove real D455 field performance (HR-4).
#
# Each sample supplies authored metrics for Sol's evaluate_all_gates().

version: 1
mount_height_m_nominal: 0.35
does_not_prove:
  - Sim/synthetic low-viewpoint gates do not prove real D455 optics (HR-4).
  - Authored OCR/ReID/VPR/curb metrics are CI scaffolding, not field bags.

thresholds:
  mount_height_m: 0.35
  mount_height_tolerance_m: 0.05
  min_sign_elevation_rad: 0.436332313  # ~25 deg
  min_ocr_char_recall: 0.70
  min_legs_visible_fraction: 0.55
  require_reid_top1: true
  min_vpr_recall_at_1: 0.60
  require_curb_from_height_map: true
  require_d455_dropped: true

samples:
  - id: nominal_pass
    expect_all_passed: true
    metrics:
      mount_height_m: 0.35
      sign_elevation_angle_rad: 0.523598776  # 30 deg
      ocr_char_recall: 0.85
      legs_visible_fraction: 0.75
      torso_visible_fraction: 0.35
      reid_top1_correct: true
      vpr_recall_at_1: 0.72
      curb_detected_from_height_map: true
      d455_depth_available: false

  - id: ocr_fail_low_recall
    expect_all_passed: false
    expect_failed_gates: [ocr_upward_angle]
    metrics:
      mount_height_m: 0.35
      sign_elevation_angle_rad: 0.523598776
      ocr_char_recall: 0.20
      legs_visible_fraction: 0.75
      torso_visible_fraction: 0.35
      reid_top1_correct: true
      vpr_recall_at_1: 0.72
      curb_detected_from_height_map: true
      d455_depth_available: false

  - id: legs_first_reid_fail
    expect_all_passed: false
    expect_failed_gates: [legs_first_reid]
    metrics:
      mount_height_m: 0.35
      sign_elevation_angle_rad: 0.523598776
      ocr_char_recall: 0.85
      legs_visible_fraction: 0.80
      torso_visible_fraction: 0.30
      reid_top1_correct: false
      vpr_recall_at_1: 0.72
      curb_detected_from_height_map: true
      d455_depth_available: false

  - id: curb_fail_d455_present
    expect_all_passed: false
    expect_failed_gates: [curb_height_map_without_d455]
    metrics:
      mount_height_m: 0.35
      sign_elevation_angle_rad: 0.523598776
      ocr_char_recall: 0.85
      legs_visible_fraction: 0.75
      torso_visible_fraction: 0.35
      reid_top1_correct: true
      vpr_recall_at_1: 0.72
      curb_detected_from_height_map: true
      d455_depth_available: true
