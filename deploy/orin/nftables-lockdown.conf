#!/usr/sbin/nft -f
#
# Parcel — the fallback ruleset. Card HW-FW.
#
# Loaded by parcel-nftables-lockdown.service, which exists only as the
# `OnFailure=` of parcel-nftables.service. It runs when the real ruleset could
# not be loaded at all: a bad edit to the defines, a kernel that rejects a
# chain type, a file that is not there. Without it, that failure leaves the
# Orin with ZERO tables while NetworkManager brings Wi-Fi up regardless —
# fail-open on the one sentence this card exists to make true.
#
# It is deliberately VARIABLE-FREE and address-based: it cannot depend on the
# interface names, because a wrong interface name is one of the failures it
# covers. 192.168.123.0/24 is the Unitree robot-LAN convention (research
# hardware fact 19), not a box-day read.
#
# It is a degraded state, not a working one: DDS does not pass, so the runtime
# cannot see the robot. That is the correct trade — the boundary holds and the
# owner keeps a shell. The ONE exception is README step 0.5 route 2, where the
# owner's own laptop is on the robot LAN: see the commented rule below.

table inet parcel_lockdown
delete table inet parcel_lockdown

table inet parcel_lockdown {
	chain input {
		type filter hook input priority 0; policy drop;
		iif lo accept
		ct state established,related accept
		ct state invalid counter drop
		icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem, echo-request, nd-neighbor-solicit, nd-neighbor-advert, nd-router-solicit, nd-router-advert } accept
		icmp type { destination-unreachable, time-exceeded, parameter-problem, echo-request } accept
		ip saddr != 192.168.123.0/24 tcp dport 22 ct state new counter accept comment "a shell, from anywhere that is not the robot LAN"

		# IF YOU TOOK README STEP 0.5 ROUTE 2 (your laptop is ON the robot LAN),
		# the rule above cannot reach you and this file is the reason a failed
		# boot would leave you with no shell at all. Uncomment ONE rule of this
		# shape, with the same address you put in nftables.conf, and keep it a
		# single host — the structural test refuses anything wider. It is still
		# address-based, so this file stays variable-free.
		#	ip saddr 192.168.123.99/32 tcp dport 22 ct state new counter accept comment "B-con laptop only; REMOVE with the one in nftables.conf"
		counter comment "lockdown input default drop"
	}

	chain forward {
		type filter hook forward priority 0; policy drop;
		counter comment "lockdown: nothing forwards, whatever else failed"
	}

	chain output {
		type filter hook output priority 0; policy accept;
		oif lo accept
		ip daddr 239.255.0.0/16 counter drop comment "no DDS discovery leaves a box in lockdown"
	}
}
