#!/usr/sbin/nft -f
#
# Parcel — the bridging half of the robot-LAN boundary. Card HW-FW.
# Loaded SEPARATELY from nftables.conf, by a failure-tolerant `ExecStart=-`
# in parcel-nftables.service. Read that unit and README.md §4 before editing.
#
# WHY IT IS ITS OWN FILE. `nft -f` is one atomic kernel batch: one failure
# aborts the whole transaction. The bridge `filter` chain type is compiled into
# `nf_tables` under CONFIG_NF_TABLES_BRIDGE (with NETFILTER_FAMILY_BRIDGE) —
# there is no separate nf_tables_bridge.ko on 5.10/5.15 — and whether the L4T
# tegra kernel sets it is UNCONFIRMED. Read it directly on the Orin:
#
#     zcat /proc/config.gz | grep -E 'NF_TABLES_BRIDGE|NETFILTER_FAMILY_BRIDGE'
#
# If it is unset, `nft -f` on this file fails with
# `Error: Could not process rule: No such file or directory`, the `-` prefix
# swallows it, and `inet parcel` — the forwarding boundary — stays loaded.
# Record the failure in hw/B_fw.txt and treat README §2's bridge hand-check as
# mandatory rather than informational.
#
# WHAT IT DOES. If the image bridges the spare RJ45 with the robot LAN, bridged
# frames never reach the `inet forward` hook unless br_netfilter is loaded. The
# alternative fix — sysctl net.bridge.bridge-nf-call-iptables=1 — changes kernel
# behaviour globally, for every table on the box including Docker's, to patch
# one table's blind spot. This does not: the bridge family sees bridged frames
# directly, needs no sysctl, and is inert where there is no bridge.
# Locally-destined frames are `input`, not `forward`, so the Orin's own DDS
# across a bridged $rnic is untouched.
#
# This file is deliberately VARIABLE-FREE: it must load on a box whose defines
# have not been filled in yet.

table bridge parcel_l2
delete table bridge parcel_l2

table bridge parcel_l2 {
	chain forward {
		type filter hook forward priority 0; policy drop;
		counter comment "no L2 bridging between the robot LAN and anything else"
	}
}
