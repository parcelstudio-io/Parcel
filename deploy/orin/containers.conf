# Parcel — container accepts for the Orin's forward chain. OPT-IN, NOT DEFAULT.
#
#   Card    HW-FW `orin-firewall` (scrum/20260822/task_43/DESIGN.md §e.2)
#   Parent  nftables.conf — this file is NOT included by it. Turning it on is a
#           dated owner decision, taken when ADR 0001's compose stack actually
#           lands on the Orin, not a hole opened months early on the chance it
#           is wanted.
#
# Why it is needed at all: `chain forward { policy drop }` also drops Docker's
# bridge traffic, so deploy/compose.yaml will not run on the Orin without this.
# Note that `safety-control` is `network_mode: none` and needs NOTHING here —
# it is the stubs on the `parcel_aux` bridge that do.
#
# The rule of this file: every accept is qualified by $dockerif — on iifname /
# oifname in the inet table, on meta ibrname / obrname in the bridge table — and
# NO rule in it may name $rnic or $lnic. The robot LAN does not become reachable
# because a container wanted the internet. tests/test_hwfw_nftables.py pins both
# sentences.
#
# TWO tables, because container traffic takes two paths. Container-to-container
# on one Docker bridge is BRIDGED: it traverses NF_BR_FORWARD, i.e.
# `bridge parcel_l2 forward policy drop` (nftables-bridge.conf), and never
# reaches `inet forward` at all without br_netfilter. An inet-only version of
# this file would leave deploy/compose.yaml's two `parcel_aux` stubs unable to
# talk to each other. If the bridge table failed to load on this kernel, the
# bridge half below is moot — and so is the drop it is undoing.
#
# To enable, on the Orin:
#   sudo install -D -m 0640 containers.conf /etc/parcel/containers.conf
#   # uncomment the include line at the foot of /etc/parcel/nftables.conf
#   sudo nft -c -f /etc/parcel/nftables.conf && sudo systemctl reload parcel-nftables
#   # then write down the date and the reason in hw/B_fw.txt

# `docker network ls` → the bridge's ifname; the default bridge is docker0 and
# compose networks are br-<id>. Name the ONE bridge the stack uses.
define dockerif = "docker0"

table inet parcel {
	chain forward {
		iifname $dockerif oifname $dockerif counter accept comment "container to container"
		iifname $dockerif oifname { $wanif, $lteif } counter accept comment "container egress to the WAN only"
		iifname { $wanif, $lteif } oifname $dockerif ct state established,related counter accept comment "return path"
	}
}

table bridge parcel_l2 {
	chain forward {
		meta ibrname $dockerif meta obrname $dockerif counter accept comment "container to container is bridged, not routed"
	}
}
