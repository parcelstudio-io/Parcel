robot:
  model: go2

simulation:
  scene: src/parcel_robot/scenes/city_block.xml
  dynamic_city:
    enabled: true
    seed: 7
    speed_scale: 1.0

skills:
  root: configs/skills

motion:
  backend: rl
  max_vx: 0.6
  max_vy: 0.4
  max_vyaw: 1.0
  smoothing:
    linear_accel: 0.9
    linear_decel: 1.4
    yaw_accel: 1.8
  sport:
    enabled: false
    interface: lo
    domain_id: 1
  rl:
    enabled: true
    policy_path: ""
    control_dt: 0.02

language_model:
  enabled: true
  provider: llama_cpp
  base_url: http://127.0.0.1:8080
  model: gemma-4-26b-a4b
  timeout: 90

agent:
  prompts_root: prompts
  personality: gentle_companion
  functions: [companion, navigator, manual_assistant]
  affect:
    minimum_confidence: 0.75
    social_action_cooldown_s: 8
    proposal_ttl_s: 20

speech:
  mode: auto
  stt_provider: whisper_cpp
  whisper_url: http://127.0.0.1:8178
  tts_provider: fish_s2
  fish_url: http://127.0.0.1:8091
  fish_reference_id: null
  fish_streaming: true
  barge_in: true

safety:
  obstacle_stop_m: 0.65
  obstacle_slow_m: 1.2
  telemetry_stale_s: 0.6

memory:
  path: parcel_memory.sqlite3

poses: {}

wifi_cards:
  simulator:
    interface: lo
    ros_domain_id: 1
    purpose: simulation
  robot:
    interface: enp3s0
    ros_domain_id: 0
    purpose: physical_robot

modules:
  - name: status
    class: parcel_robot.modules.StatusModule
    enabled: true
    config:
      label: parcel-dog
