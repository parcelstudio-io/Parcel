robot:
  model: go2

language_model:
  enabled: false
  provider: llama_cpp
  base_url: http://127.0.0.1:8080
  model: gemma
  timeout: 30

speech:
  stt_provider: whisper_cpp
  whisper_url: http://127.0.0.1:8178
  tts_provider: csm
  csm_url: http://127.0.0.1:8090
  speaker: 0

memory:
  path: parcel_memory.sqlite3

poses:
  sit:
    duration: 1.5
    joints:
      FL_hip_joint: 0.0
      FL_thigh_joint: 1.1
      FL_calf_joint: -2.1
      FR_hip_joint: 0.0
      FR_thigh_joint: 1.1
      FR_calf_joint: -2.1
      RL_hip_joint: 0.0
      RL_thigh_joint: 1.3
      RL_calf_joint: -2.3
      RR_hip_joint: 0.0
      RR_thigh_joint: 1.3
      RR_calf_joint: -2.3
  bow:
    duration: 1.2
    joints:
      FL_hip_joint: 0.0
      FL_thigh_joint: 1.2
      FL_calf_joint: -2.2
      FR_hip_joint: 0.0
      FR_thigh_joint: 1.2
      FR_calf_joint: -2.2
      RL_hip_joint: 0.0
      RL_thigh_joint: 0.8
      RL_calf_joint: -1.6
      RR_hip_joint: 0.0
      RR_thigh_joint: 0.8
      RR_calf_joint: -1.6

wifi_cards:
  simulator:
    interface: lo
    ros_domain_id: 1
    purpose: simulation
  robot:
    interface: enp3s0
    ros_domain_id: 0
    purpose: physical_robot

modules:
  - name: status
    class: parcel_robot.modules.StatusModule
    enabled: true
    config:
      label: parcel-dog
