# Repo-root mirror of packaged storefront fixtures (P3 OCR sim).
# Canonical packaged copy:
#   src/parcel_robot/runtime_assets/fixtures/storefronts/manifest.yaml
# Prefer parcel_robot.storefront.fixtures.load_manifest() for resolution.

schema_version: 1
does_not_prove:
  - Synthetic placard textures are not wild storefront photography.
  - Fake OCR from fixture metadata does not validate PP-OCRv6 field recall.
  - Passing CI OCR smoke does not prove ≥90% named-place precision outdoors.

