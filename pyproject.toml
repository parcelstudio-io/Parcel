[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parcel-robot-dog"
version = "0.1.0"
description = "Extensible ROS 2 voice-agent controls for a Unitree robot dog"
requires-python = ">=3.10"
# ---- CARD HW-1 py310-clean (scrum/20260822/task_35) ----
# TESTED INTERPRETER RANGE PER EXTRA. The floor above is the package's own and
# it is now TRUE rather than aspirational: `src/parcel_robot` imports on
# CPython 3.10, held there by `tests/test_hw1_py310_clean.py`. The dog's Orin
# NX runs JetPack's system CPython 3.10 (WAVE3_HW_DESIGN_FABLE.md §5.1, seam
# S22). Wheel metadata has no per-extra floor, so the ranges are published
# here — each one MEASURED against PyPI for cp310/aarch64 on 2026-08-23, not
# remembered (`pip download --only-binary=:all: --python-version 3.10
# --implementation cp --abi cp310 --platform manylinux2014_aarch64 ...`):
#
#   (core)             >= 3.10  mujoco 3.12.0, numpy 2.2.6, PyYAML 6.0.3 all
#                               have cp310 aarch64 wheels. numpy 2.2.6 is the
#                               LAST numpy that does — 2.5.1 (the desktop lock)
#                               needs >= 3.12. See requirements-lock-jetson.txt.
#   base               >= 3.10  the core dependencies, named as an extra so the
#                               design's `pip install -e '.[base]'` resolves.
#   dev                >= 3.10  pytest 8.4.2, pytest-xdist 3.8.0, ruff 0.16.1.
#   camera             >= 3.10  opencv-python-headless 5.0.0.93 (cp37-abi3).
#   camera-realsense   >= 3.10  pyrealsense2 2.58.3.10794 cp310 aarch64.
#   voice              >= 3.11  websockets 17.0/17.0.1 declare Requires-Python
#                               >= 3.11; the highest resolvable on 3.10 is
#                               16.1.1. NOT installable on the dog.
#   perception         >= 3.11  onnxruntime-gpu >= 1.28 is >= 3.11 AND
#                               publishes no aarch64 wheel at ANY version.
#                               NOT installable on the dog — see below.
#   perception-jetson  == 3.10  the Orin's own detector venv (design §5.2).
#
# The 3.14/x86_64 lock `requirements-lock.txt` is untouched by this card.
# ---- END CARD HW-1 py310-clean ----
dependencies = [
  "mujoco>=3.3,<4",
  "numpy>=2,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
# ---- CARD HW-1 py310-clean (scrum/20260822/task_35) ----
# `base` is deliberately EMPTY: an extra's requirements are added TO the core
# `dependencies`, never instead of them, so `pip install -e '.[base]'` installs
# exactly mujoco + numpy + PyYAML and nothing else. Naming it costs nothing and
# buys two things: the §5.1 install command resolves instead of warning
# "does not provide the extra", and there is one obvious name for "the set the
# Orin's 3.10 venv gets" that cannot drift out of step with `dependencies`
# above the way a copied list would.
base = []
# ---- END CARD HW-1 py310-clean ----
dev = [
  "pytest>=8,<9",
  # Card P0-E: parallel default suite (`pytest -n auto`) if the suite proves
  # xdist-clean; see scrum/20260822/task_5/P0E_STATUS.md for the verdict.
  "pytest-xdist>=3,<4",
  # Card GATE-0 (scrum/20260822/task_20): PINNED, not ranged. The commit gate's
  # ruff verdict is a RATCHET against a recorded set of (file, rule)
  # fingerprints, and a different ruff enables a different rule set — this tree
  # yields 7 fingerprints on 0.16.x and roughly 51 on 0.15.x. Under `>=0.12,<1`
  # the verdict was whatever pip resolved that day, which is not a gate.
  # `scripts/ci_ruff_baseline.json` stamps `ruff_version` and `evaluate_ruff`
  # ERRORS on a mismatch, so this pin and that stamp move together.
  "ruff==0.16.1",
]
# Card P0-C: the GPU detector in the production venv.
#
#   .parcel/bin/pip install -e '.[perception]'
#
# WHY THIS IS AN EXTRA AND NOT A BASE DEPENDENCY: it REPLACES the CPU
# `onnxruntime` package rather than sitting beside it — both projects install the
# same `onnxruntime` import package, so pip will happily leave you with a half of
# each. Uninstall `onnxruntime` first. Everything in the repo keeps working
# afterwards, because onnxruntime-gpu still registers CPUExecutionProvider; what
# it adds is CUDAExecutionProvider.
#
# WHY THE [cuda,cudnn] EXTRAS ARE NOT OPTIONAL HERE (measured, PG-1 §6): the bare
# `onnxruntime-gpu` wheel advertises CUDAExecutionProvider in
# get_available_providers() from a stub, then fails to load libcublasLt at
# session construction and SILENTLY BUILDS A CPU SESSION — an fp16 graph on the
# CPU at 726 ms/query, slower than the 524 ms int8 path it displaced. The
# `cuda`/`cudnn` extras pull the nvidia-* runtime wheels that
# `perception_providers.prepare_cuda_runtime()` then makes findable via
# `onnxruntime.preload_dlls()`. ~3 GB on disk.
# `perception_providers.assert_provider_honoured()` is the backstop that refuses
# the CPU-in-disguise session if any of that is missing.
#
# VERSION: >=1.28 because 1.28.0 is the exact version proved on this host
# (Python 3.14.4, driver 595.84 / CUDA 13.2, RTX 5000 Ada) — wheel tag
# cp314-cp314-manylinux_2_28_x86_64 — and because it matches the CPU
# `onnxruntime` 1.28.0 it replaces, so the provider is the only variable.
perception = [
  "onnxruntime-gpu[cuda,cudnn]>=1.28,<2",
]
# ---- CARD HW-1 py310-clean (scrum/20260822/task_35) ----
# The same detector on the dog's Orin NX, which the `perception` extra above
# cannot serve: measured 2026-08-23, `onnxruntime-gpu` publishes NO aarch64
# wheel on PyPI at any version ("from versions: none"), and >= 1.28 also
# requires >= 3.11 while JetPack 6 gives us CPython 3.10
# (WAVE3_HW_DESIGN_FABLE.md §2.2, §5.2).
#
# So this extra is UNPINNED on purpose. The wheel that satisfies it does not
# come from PyPI: it comes from the Jetson index (jetson-ai-lab / Ultralytics
# `onnxruntime_gpu-1.23.0-cp310-linux_aarch64`), installed by HW-7's script
# with its own `--extra-index-url`. Pinning a range here would only encode a
# PyPI resolution that does not exist on this platform. `pip install
# '.[perception-jetson]'` against plain PyPI is EXPECTED to fail; that is the
# honest failure, and the script is the remedy.
#
# The runtime never imports onnxruntime (design §5.2): the detector lives
# behind `perception_daemon/`'s AF_UNIX boundary in its own venv, and an absent
# daemon is a typed degrade. Nothing in `src/parcel_robot` changes with this
# extra installed or not.
perception-jetson = [
  "onnxruntime-gpu",
]
# ---- END CARD HW-1 py310-clean ----
# Card P1-A: real eyes. The physical camera backends
# (`camera_channel/backends/{uvc,realsense,recorded}.py`).
#
#   .parcel/bin/pip install -e '.[camera]'            # webcam + recorded clips
#   .parcel/bin/pip install -e '.[camera-realsense]'  # + the D455
#
# WHY TWO EXTRAS. `opencv-python-headless` is 40 MB and opens any /dev/video*;
# `pyrealsense2` is 13 MB of librealsense and is useful only if a RealSense is
# on the bus. Splitting them means a laptop with a webcam does not carry the
# D455 stack, and the RECORDED backend — the one CI actually runs — needs
# neither: it replays a committed clip through numpy alone. That is deliberate,
# so the contract tests cannot be silently skipped for a missing optional wheel.
#
# WHY headless: the repo runs offscreen (EGL, no X). `opencv-python` pulls a Qt
# GUI stack that is dead weight on a robot and can fight MuJoCo's GL binding.
#
# VERSION: >=4.10 is the first release with numpy-2 wheels (numpy>=2 is a base
# dependency); 5.0.0.93 is what resolves and was installed on this host,
# 2026-08-22.
camera = [
  "opencv-python-headless>=4.10,<6",
]
# NOTE, measured 2026-08-22 and contradicting the card's premise: pyrealsense2
# ships a cp314 wheel (2.58.3.10794-cp314-cp314-manylinux1_x86_64) that imports
# in this venv. The "Python-3.11 sidecar" the card specified is therefore NOT
# needed and was not built; see the module docstring of
# camera_channel/backends/realsense.py for the full reasoning.
camera-realsense = [
  "opencv-python-headless>=4.10,<6",
  "pyrealsense2>=2.55,<3",
]
voice = [
  "msgpack>=1.1,<2",
  "sounddevice>=0.5,<1",
  "websockets>=17,<18",
]
# Research H7 (research/20260823/localization-delegation-bench): the delegated
# MAP-role localizer behind `src/parcel_robot/localization/`.
#
#   .parcel/bin/pip install -e '.[localization]'
#
# NOT `kiss-icp`, which the H7 design named, and not `open3d`, its first
# fallback. Measured on this host 2026-08-23 (CPython 3.14.4):
#   * `pip install kiss-icp`   -> only the 1.3.0 sdist exists (no cp314 wheel)
#     and its build fails at the requirements step: "ERROR: Use cmake.version
#     instead of cmake.minimum-version with scikit-build-core >= 0.8".
#   * `pip install open3d`     -> "Could not find a version that satisfies the
#     requirement open3d (from versions: none)" on cp314.
#   * `pip install small-gicp`  -> 1.0.1, cp314 wheel, imports and runs.
# `small-gicp` is the same class of dependency KISS-ICP is (a C++ registration
# library: voxel downsampling, KdTree correspondences, ICP / point-to-plane /
# GICP / VGICP) with no ROS, no PCL and no torch, so the "delegate metric
# localization, do not own a filter" property this repo is testing survives the
# substitution. Nothing in `src/parcel_robot` imports it outside the
# `localization/` package, and nothing in the runtime imports that package, so
# the extra being absent changes no product behaviour — it only skips
# `tests/test_h7_localization_contract.py`.
localization = [
  "small-gicp>=1.0,<2",
]

[project.scripts]
parcel-agent = "parcel_robot.cli:main"
parcel-sim = "parcel_robot.sim:main"
parcel-control = "parcel_robot.control_panel:main"
parcel-panel = "parcel_robot.web_panel:main"
parcel-unitree-control = "parcel_robot.unitree_control:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
parcel_robot = [
  "bridge/fixtures/*.json",
  "config/*.yaml",
  "scenes/*.xml",
  # Card W-1: the scene textures and visual meshes the MJCF references. Without
  # this glob a wheel ships a scene whose <texture file=...> targets are absent
  # and MuJoCo refuses to compile it.
  "scenes/assets/*.json",
  "scenes/assets/textures/*.png",
  "scenes/assets/meshes/*.obj",
  "ui/*.html",
  "runtime_assets/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Local TMPDIR / pytest scratch must never enter the commit-gate ruff ratchet.
extend-exclude = [".tmp_ci", ".tmp", ".parcel"]
